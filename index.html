
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Quiz App</title>

  <link rel="stylesheet" href="./src/output.css" />
</head>

<body class="flex min-h-screen items-center justify-center bg-slate-950 p-4 text-white">

  <main
    id="quiz-container"
    class="w-full max-w-2xl rounded-2xl border border-slate-700 bg-slate-800 p-6"
  >

    <!-- START SCREEN -->

    <section id="start-screen" class="text-center">

      <div class="mb-6 text-5xl">
        🎯
      </div>

      <h1 class="mb-4 text-3xl font-bold">
        Welcome to Quiz App!
      </h1>

      <p class="mb-6 text-slate-300">
        Test your knowledge and challenge yourself.
      </p>

      <p class="mb-8 text-sm text-slate-400">
        Multiple Choice Quiz
      </p>

      <button
        id="start-button"
        type="button"
        class="w-full rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-500"
      >
        Start Quiz
      </button>

    </section>


    <!-- QUIZ SCREEN -->

    <section id="quiz-screen" class="hidden">

      <h1 class="mb-6 text-center text-3xl font-bold">
        Quiz App
      </h1>

      <!-- Question Number and Score -->

      <div class="mb-4 flex items-center justify-between text-slate-300">

        <p id="question-number">
          Question 1 / 10
        </p>

        <p id="score">
          Score: 0
        </p>

      </div>


      <!-- Progress Bar -->

      <div class="mb-8 h-2 w-full overflow-hidden rounded-full bg-slate-700">

        <div
          id="progress-bar"
          class="h-full w-[10%] rounded-full bg-indigo-500"
        ></div>

      </div>


      <!-- Question Display -->

      <section class="mb-6 rounded-xl border border-slate-700 bg-slate-900 p-5">

        <h2 id="question" class="text-xl font-semibold leading-relaxed">
          What is the capital of India?
        </h2>

      </section>


      <!-- Options Area -->

      <div id="options" class="grid gap-3">

      </div>


      <!-- Feedback -->

      <p id="feedback" class="mt-4 text-center font-medium"></p>


      <!-- Next Question Button -->

      <button
        id="next-button"
        type="button"
        disabled
        class="mt-6 w-full rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50"
      >
        Next Question
      </button>

    </section>


    <!-- RESULT SCREEN -->

    <section id="result-screen" class="hidden text-center">

      <div class="mb-4 text-5xl">
        🏆
      </div>

      <h2 class="mb-4 text-2xl font-bold">
        Quiz Completed!
      </h2>

      <p class="mb-2 text-slate-300">
        Your Final Score
      </p>

      <p
        id="final-score"
        class="text-4xl font-bold text-indigo-400"
      >
        0 / 10
      </p>

      <p class="mt-4 text-slate-400">
        Great job! Thanks for playing.
      </p>

      <button
        id="restart-button"
        type="button"
        class="mt-8 w-full rounded-lg bg-emerald-600 px-5 py-3 font-semibold text-white transition hover:bg-emerald-500"
      >
        Restart Quiz
      </button>

    </section>

  </main>


  <!-- JavaScript -->

  <script src="./script.js"></script>

</body>
</html>
